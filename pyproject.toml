[project]
name = "raglens"
version = "0.1.0"
description = "Dashboard de qualidade de RAG — saude de indice + eval de retrieval"
requires-python = ">=3.10"
# Nucleo (health) roda so com stdlib. Deps abaixo so o adapter do SB / Fase 3 usam.
dependencies = []

[project.optional-dependencies]
sb = ["voyageai", "sqlite-vec"]

[project.scripts]
raglens = "raglens.cli:main"

[tool.setuptools.packages.find]
include = ["raglens*", "adapters*"]
